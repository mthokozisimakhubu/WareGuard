<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | WARE GUARD</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/PHOTOS/hawk-eagle-logo-white-black_677805-1179.avif">
    <style>
        .error-message {
            color: #d9534f;
            margin: 10px 0;
            padding: 10px;
            background-color: #f2dede;
            border: 1px solid #ebccd1;
            border-radius: 4px;
            text-align: center;
        }

        .login-form {
            max-width: 400px;
            margin: 0 auto;
            padding: 10px;
        }

        .login-form label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: white;
        }

        .login-form input[type="text"],
        .login-form input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.432);
            color: white;
        }

        .login-form input[type="submit"] {
            background-color: #fcb860;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            font-size: 16px;
            width: 100%;
        }

        .login-form input[type="submit"]:hover {
            background-color: #68c3ff;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            color: white;
        }

        .signup-link a {
            color: #39e1ff67;
            text-decoration: none;
        }
        .signup-link  :hover {
            color: #3e0ead;
        }

        .reset-link {
            text-align: center;
            margin-top: 10px;
        }

        .reset-link a {
            color: #d9534f;
            text-decoration: none;
        }
        .reset-link :hover {
            color: #5e0603;
        }

        .box {
            padding: 30px;
            width: 500px;
            /* Increased width */
            min-height: 500px;
            /* Adjusted height */
            backdrop-filter: blur(20px);
            border-radius: 5px;
            background: rgba(49, 49, 49, .2);
            border: solid 1px rgba(225, 255, 255, .5);
            overflow: auto;
            /* Prevent content from overflowing */
        }

        .password-container {
            position: relative;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 35px;
            cursor: pointer;
            color: white;
        }
    </style>
</head>



<body class="body">
    <div class="box">
        <div class="link hawk">
            <img src="/static/PHOTOS/hawk-eagle-logo-white-black_677805-1179.avif" alt="Hawk Logo">
        </div>

        <h1><i>Login</i></h1>




        <!-- Make sure form action points to login route -->
        <!-- Make sure form action points to login route -->
        <form class="login-form" method="POST">
            <label for="name">name:</label>
            <input type="text" id="name" name="username" required placeholder="Enter your name">

            <div class="password-container">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
                <span class="show-password" onclick="togglePassword()">👁️</span>
            </div>

            <input type="submit" value="Login">

            <div class="signup-link">
                Don't have an account? <a href="{{ url_for('signup') }}">Create an Account</a>
            </div>

            <div class="reset-link">
                <a href="#">Reset Password</a>
            </div>
        </form>
    </div>

    <script>
        function togglePassword() {
            const passwordField = document.getElementById('password');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
            } else {
                passwordField.type = 'password';
            }
        }
    </script>
</body>






</html>
